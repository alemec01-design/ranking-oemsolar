<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Corrida Operacional · O&M Solar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg: #060A13;
    --bg-panel: #0F1826;
    --line: #24344C;
    --text: #E9F0FA;
    --text-dim: #7C90AC;
    --amber: #FFB020;
    --amber-2: #FF7A1A;
    --cyan: #4CE0E0;
    --danger: #FF5D6C;
    --gold: #FFD166;
    --silver: #C9D3DE;
    --bronze: #D8985B;
    --radius: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height:100vh; line-height:1.5; overflow-x:hidden; position:relative;
  }
  h1,h2,h3, .digital{ font-family:'Orbitron', system-ui, sans-serif; }

  #stars{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .neb{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.28; }
  .neb1{ width:520px; height:520px; background:#3A2E86; top:-160px; right:-120px; }
  .neb2{ width:420px; height:420px; background:#1A4A5A; bottom:-140px; left:-100px; }
  .star{ position:absolute; background:#fff; border-radius:50%; animation: twinkle linear infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:.15; } 50%{ opacity:1; } }

  .wrap{ max-width: 900px; margin: 0 auto; padding: 32px 20px 90px; position:relative; z-index:1; }

  header.top{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom: 10px; flex-wrap: wrap; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand .mark{ width:46px;height:46px;border-radius:12px; background: linear-gradient(135deg, var(--amber), var(--amber-2)); display:flex;align-items:center;justify-content:center; font-size:22px; flex-shrink:0; box-shadow: 0 0 24px rgba(255,176,32,0.45); }
  .brand h1{ font-size: 21px; margin:0; color:var(--text); font-weight:800; letter-spacing:.03em; text-shadow: 0 0 18px rgba(255,176,32,.35); }
  .brand p{ margin:3px 0 0; font-size:12px; color:var(--text-dim); letter-spacing:.08em; text-transform:uppercase; }
  .live-badge{ display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; color:#FFB3B3; border:1px solid #6E2530; background:#2A1216; padding:7px 14px; border-radius:999px; letter-spacing:.06em; cursor:pointer; user-select:none; }
  .live-badge:hover{ filter:brightness(1.15); }
  .live-dot{ width:8px;height:8px;border-radius:50%; background:var(--danger); animation: pulse-dot 1.4s ease-in-out infinite; box-shadow: 0 0 10px var(--danger); }
  @keyframes pulse-dot{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.4; transform:scale(.7);} }

  .updated-row{ font-size:11.5px; color:var(--text-dim); margin-bottom:22px; }

  .card{ background: linear-gradient(180deg, var(--bg-panel), #0B1220); border:1px solid var(--line); border-radius: var(--radius); padding: 22px; backdrop-filter: blur(6px); margin-bottom:20px; }
  .dept-heading{ display:flex; align-items:center; gap:9px; margin-bottom:14px; }
  .dept-heading h2{ font-size:16px; margin:0; font-weight:800; letter-spacing:.02em; }
  .dept-heading .count-tag{ font-size:10.5px; color:var(--text-dim); background:#0E1826; border:1px solid var(--line); padding:3px 9px; border-radius:999px; margin-left:auto; }

  /* Pódio */
  .podium{ display:flex; align-items:flex-end; gap:10px; margin-bottom:22px; }
  .podium-slot{ flex:1; text-align:center; }
  .podium-emoji{ font-size:22px; margin-bottom:5px; }
  .podium-name{ font-size:12px; font-weight:700; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .podium-score{ font-family:'Orbitron'; font-weight:800; font-size:14px; }
  .podium-bar{ border-radius:10px 10px 0 0; margin-top:8px; position:relative; overflow:hidden; }
  .podium-bar::after{ content:''; position:absolute; inset:0; background: linear-gradient(180deg, rgba(255,255,255,.18), transparent 60%); }
  .p-1 .podium-bar{ height:76px; background: linear-gradient(180deg,#FFD166,#B8891A); box-shadow:0 0 26px rgba(255,209,102,.35); }
  .p-2 .podium-bar{ height:54px; background: linear-gradient(180deg,#D8E0EA,#8C9AAC); }
  .p-3 .podium-bar{ height:40px; background: linear-gradient(180deg,#E3AD78,#9A5F30); }
  .p-1 .podium-score{ color:var(--gold); }
  .p-2 .podium-score{ color:var(--silver); }
  .p-3 .podium-score{ color:var(--bronze); }
  .podium-empty{ opacity:.25; }

  /* Corrida */
  .race-row{ margin-bottom:16px; }
  .race-row:last-child{ margin-bottom:0; }
  .race-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .race-name{ font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; }
  .race-pos{ font-family:'Orbitron'; font-weight:800; font-size:12px; color:var(--text-dim); width:20px; }
  .race-row.p1 .race-pos{ color:var(--gold); }
  .race-row.p2 .race-pos{ color:var(--silver); }
  .race-row.p3 .race-pos{ color:var(--bronze); }
  .race-score{ font-family:'Orbitron'; font-weight:800; font-size:14px; color:var(--amber); }
  .track{ position:relative; height:14px; background: linear-gradient(90deg, #0B1220, #131F30); border-radius:999px; border:1px solid var(--line); }
  .track-inner{ position:relative; height:100%; border-radius:999px; overflow:hidden; }
  .track-fill{ position:absolute; left:0; top:0; height:100%; border-radius:999px; background: linear-gradient(90deg, var(--amber-2), var(--amber)); transition: width 1s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 14px rgba(255,176,32,.5); }
  .track-rocket{ position:absolute; top:50%; transform: translate(-50%,-50%); font-size:17px; transition: left 1s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 0 6px rgba(255,176,32,.8)); z-index:2; }
  .empty{ color:var(--text-dim); font-size:13px; padding: 16px 10px; text-align:center; }
  .err-box{ color:var(--danger); font-size:12.5px; padding: 14px; text-align:center; border:1px dashed #6E2530; border-radius:10px; }

  @keyframes popIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .race-row{ animation: popIn .35s ease both; }
</style>
</head>
<body>

<div id="stars"><div class="neb neb1"></div><div class="neb neb2"></div></div>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark">🚀</div>
      <div>
        <h1>CORRIDA OPERACIONAL</h1>
        <p>O&M Solar · Performance em tempo real</p>
      </div>
    </div>
    <div class="live-badge" id="refresh-btn"><span class="live-dot"></span> AO VIVO · atualizar</div>
  </header>
  <div class="updated-row" id="updated-row">Carregando dados da planilha…</div>

  <div id="departments-overview"></div>
</div>

<script>
  // ====== LINKS CSV PUBLICADOS (Google Sheets) ======
  const CSV_URLS = {
    campo_tecnico: "https://docs.google.com/spreadsheets/d/e/2PACX-1vToIGrWZlyEKaMcDcjHVCfXhBUfA0i-M3W46HwOjYywdDfwb0aUbFzmS7Q-L2MOK_2W0p_LObYQLt2n/pub?gid=1974176296&single=true&output=csv",
    supervisores:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vToIGrWZlyEKaMcDcjHVCfXhBUfA0i-M3W46HwOjYywdDfwb0aUbFzmS7Q-L2MOK_2W0p_LObYQLt2n/pub?gid=231248973&single=true&output=csv",
    cog:           "https://docs.google.com/spreadsheets/d/e/2PACX-1vToIGrWZlyEKaMcDcjHVCfXhBUfA0i-M3W46HwOjYywdDfwb0aUbFzmS7Q-L2MOK_2W0p_LObYQLt2n/pub?gid=750899901&single=true&output=csv",
    pcm:           "https://docs.google.com/spreadsheets/d/e/2PACX-1vToIGrWZlyEKaMcDcjHVCfXhBUfA0i-M3W46HwOjYywdDfwb0aUbFzmS7Q-L2MOK_2W0p_LObYQLt2n/pub?gid=680953866&single=true&output=csv",
  };
  const AUTO_REFRESH_MINUTES = 5;
  // ====================================================

  const DEPTS = {
    campo_tecnico: { title: '🔧 Campo Técnico' },
    supervisores:  { title: '🧭 Supervisores' },
    cog:           { title: '🛰️ COG' },
    pcm:           { title: '🗓️ PCM' },
  };
  const DEPT_ORDER = ['campo_tecnico','supervisores','cog','pcm'];

  function withCacheBust(url){
    return url + (url.includes('?') ? '&' : '?') + '_=' + Date.now();
  }

  // ---- Estrelas de fundo ----
  (function generateStars(){
    const container = document.getElementById('stars');
    const n = window.innerWidth < 700 ? 60 : 120;
    for(let i = 0; i < n; i++){
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2 + 0.6;
      s.style.width = size + 'px'; s.style.height = size + 'px';
      s.style.top = Math.random() * 100 + '%'; s.style.left = Math.random() * 100 + '%';
      s.style.animationDuration = (Math.random() * 3 + 2) + 's';
      s.style.animationDelay = (Math.random() * 3) + 's';
      container.appendChild(s);
    }
  })();

  // ---- Monta os blocos (um por departamento, empilhados) ----
  (function buildOverview(){
    const container = document.getElementById('departments-overview');
    container.innerHTML = DEPT_ORDER.map(key => `
      <div class="card dept-block" data-dept="${key}">
        <div class="dept-heading">
          <h2>🚀 ${DEPTS[key].title}</h2>
          <span class="count-tag" id="count-${key}">—</span>
        </div>
        <div class="podium" id="podium-${key}"></div>
        <div id="race-${key}"><div class="empty">Carregando…</div></div>
      </div>
    `).join('');
  })();

  document.getElementById('refresh-btn').onclick = loadAll;

  function loadAll(){
    document.getElementById('updated-row').textContent = 'Atualizando…';
    Promise.all(DEPT_ORDER.map(loadDept)).then(() => {
      const agora = new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
      document.getElementById('updated-row').textContent = 'Última atualização: ' + agora;
    });
  }

  // Converte "9,244444444" (formato PT-BR) ou 9.24 (número normal) em Number
  function parseNumberBR(val){
    if(typeof val === 'number') return val;
    if(typeof val !== 'string') return NaN;
    const cleaned = val.trim().replace(/\./g, '').replace(',', '.');
    const n = parseFloat(val.includes(',') ? cleaned : val.trim());
    return isNaN(n) ? NaN : n;
  }

  // A planilha publicada traz linhas de título/instrução antes da tabela de verdade.
  // Este parser acha a linha de cabeçalho de verdade (onde a 1ª coluna é "Nome").
  function parseDeptCsv(text){
    const parsed = Papa.parse(text, { skipEmptyLines: false });
    const rows = parsed.data;
    let headerIdx = -1;
    for(let i = 0; i < rows.length; i++){
      if(rows[i] && String(rows[i][0]).trim().toLowerCase() === 'nome'){
        headerIdx = i;
        break;
      }
    }
    if(headerIdx === -1) return [];

    const headers = rows[headerIdx].map(h => String(h).trim());
    const nomeCol = headers.findIndex(h => h.toLowerCase() === 'nome');
    const scoreCol = headers.findIndex(h => h.toLowerCase().replace(/\s+/g,' ').includes('pontuação final') || h.toLowerCase().replace(/\s+/g,' ').includes('pontuacao final'));

    if(nomeCol === -1 || scoreCol === -1) return [];

    const out = [];
    for(let i = headerIdx + 1; i < rows.length; i++){
      const row = rows[i];
      if(!row) continue;
      const nome = row[nomeCol] ? String(row[nomeCol]).trim() : '';
      if(!nome) continue;
      const media = parseNumberBR(row[scoreCol]);
      if(isNaN(media)) continue;
      out.push({ nome, media });
    }
    return out;
  }

  async function loadDept(dept){
    const container = document.getElementById('race-' + dept);
    const countTag = document.getElementById('count-' + dept);
    try{
      const res = await fetch(withCacheBust(CSV_URLS[dept]));
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const ranked = parseDeptCsv(text).sort((a,b) => b.media - a.media);

      countTag.textContent = ranked.length + (ranked.length === 1 ? ' pessoa' : ' pessoas');
      renderPodium(dept, ranked);

      if(ranked.length === 0){
        container.innerHTML = '<div class="empty">Preencha os dados na planilha — a corrida aparece assim que houver pontuação.</div>';
        return;
      }

      const max = ranked[0].media;
      container.innerHTML = ranked.map((p, i) => {
        const pos = i + 1;
        const cls = pos === 1 ? 'p1' : pos === 2 ? 'p2' : pos === 3 ? 'p3' : '';
        const pct = max > 0 ? Math.max(6, (p.media / max) * 92) + 4 : 6;
        return `
          <div class="race-row ${cls}" style="animation-delay:${i * 0.04}s">
            <div class="race-top">
              <div class="race-name"><span class="race-pos">${pos}º</span>${escapeHtml(p.nome)}</div>
              <div class="race-score">${p.media.toFixed(1)}<span style="color:var(--text-dim); font-weight:500; font-size:10.5px;"> / 10</span></div>
            </div>
            <div class="track"><div class="track-inner"><div class="track-fill" style="width:${pct}%;"></div></div><div class="track-rocket" style="left:${pct}%;">🚀</div></div>
          </div>`;
      }).join('');

    } catch(err){
      container.innerHTML = '<div class="err-box">Não consegui ler esta aba da planilha. Confirme se ela foi publicada como CSV (Arquivo → Compartilhar → Publicar na Web).</div>';
      document.getElementById('podium-' + dept).innerHTML = '';
    }
  }

  function renderPodium(dept, ranked){
    const podium = document.getElementById('podium-' + dept);
    const order = [1, 0, 2];
    const medals = ['🥈','🥇','🥉'];
    let html = '';
    order.forEach((idx, slot) => {
      const p = ranked[idx];
      const posClass = idx === 0 ? 'p-1' : idx === 1 ? 'p-2' : 'p-3';
      if(!p){
        html += `<div class="podium-slot ${posClass} podium-empty"><div class="podium-emoji">${medals[slot]}</div><div class="podium-name">—</div><div class="podium-bar"></div></div>`;
      } else {
        html += `<div class="podium-slot ${posClass}"><div class="podium-emoji">${medals[slot]}</div><div class="podium-name">${escapeHtml(p.nome)}</div><div class="podium-score">${p.media.toFixed(1)}</div><div class="podium-bar"></div></div>`;
      }
    });
    podium.innerHTML = html;
  }

  function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

  loadAll();
  setInterval(loadAll, AUTO_REFRESH_MINUTES * 60 * 1000);
</script>

</body>
</html>
