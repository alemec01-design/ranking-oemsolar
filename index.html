<script>

/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */

const SPREADSHEET_ID =
  "1HfCVhq4e4odHrJ4N15gjpz5VbwR3arewYElwkYo9h5Q";


const DEPARTMENTS = [

  {
    key: "Tecnicos",
    name: "🚀 Campo Técnico",
    sheet: "Tecnicos"
  },

  {
    key: "Supervisores",
    name: "🚀 Supervisores",
    sheet: "Supervisores"
  },

  {
    key: "COG",
    name: "🚀 COG",
    sheet: "COG"
  },

  {
    key: "PCM",
    name: "🚀 PCM",
    sheet: "PCM"
  }

];


const REFRESH_INTERVAL =
  5 * 60 * 1000;


let loading = false;


/* =========================================================
   UTILITÁRIOS
   ========================================================= */

function normalizeText(value) {

  return String(value ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim()
    .toLowerCase();

}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function parseScore(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return 0;
  }


  if (typeof value === "number") {
    return Number.isFinite(value)
      ? value
      : 0;
  }


  let text =
    String(value)
      .trim()
      .replace(/\s/g,"");


  /*
     Remove símbolos comuns.
  */

  text =
    text.replace(/[R$%]/g,"");


  /*
     Exemplo:

     1.234,56
     vira
     1234.56
  */

  if (
    text.includes(".") &&
    text.includes(",")
  ) {

    if (
      text.lastIndexOf(",") >
      text.lastIndexOf(".")
    ) {

      text =
        text
          .replace(/\./g,"")
          .replace(",",".");
    }

    else {

      text =
        text.replace(/,/g,"");

    }

  }

  else if (
    text.includes(",")
  ) {

    text =
      text.replace(",",".");
  }


  const number =
    parseFloat(text);


  return Number.isFinite(number)
    ? number
    : 0;

}


function formatScore(value) {

  return Number(value)
    .toLocaleString(
      "pt-BR",
      {
        maximumFractionDigits: 2
      }
    );

}


/* =========================================================
   CARDS
   ========================================================= */

function initializeDashboard() {

  document.getElementById(
    "departments"
  ).innerHTML =

    DEPARTMENTS
      .map(department => `

        <section
          class="department"
          id="department-${department.key}"
        >

          <div class="department-header">

            <div>

              <div class="department-name">
                ${department.name}
              </div>

              <div class="department-subtitle">
                Aba: ${department.sheet}
              </div>

            </div>

            <div
              class="people-count"
              id="count-${department.key}"
            >
              0 pessoas
            </div>

          </div>


          <div
            class="status loading"
            id="status-${department.key}"
          >
            ⏳ Carregando...
          </div>


          <div
            class="diagnostic"
            id="diagnostic-${department.key}"
          ></div>


          <div
            class="podium"
            id="podium-${department.key}"
          ></div>


          <div
            class="ranking"
            id="ranking-${department.key}"
          ></div>

        </section>

      `)
      .join("");

}


/* =========================================================
   GOOGLE SHEETS
   ========================================================= */

async function loadSheet(sheetName) {

  const url =
    "https://docs.google.com/spreadsheets/d/" +
    SPREADSHEET_ID +
    "/gviz/tq" +
    "?tqx=out:json" +
    "&sheet=" +
    encodeURIComponent(sheetName) +
    "&headers=1" +
    "&_=" +
    Date.now();


  const response =
    await fetch(
      url,
      {
        method: "GET",
        cache: "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP " + response.status
    );

  }


  const raw =
    await response.text();


  if (!raw) {

    throw new Error(
      "Resposta vazia do Google Sheets."
    );

  }


  /*
     Localiza o primeiro {

     Isso remove:

     google.visualization.Query.setResponse(
  */

  const firstBrace =
    raw.indexOf("{");


  const lastBrace =
    raw.lastIndexOf("}");


  if (
    firstBrace === -1 ||
    lastBrace === -1
  ) {

    throw new Error(
      "Google Sheets não retornou JSON."
    );

  }


  const jsonString =
    raw.substring(
      firstBrace,
      lastBrace + 1
    );


  let data;


  try {

    data =
      JSON.parse(jsonString);

  }

  catch(error) {

    console.error(
      "Resposta Google Sheets:",
      raw
    );

    throw new Error(
      "JSON inválido retornado pelo Google Sheets."
    );

  }


  if (
    data.status &&
    data.status !== "ok"
  ) {

    throw new Error(
      "Google Sheets retornou erro."
    );

  }


  if (!data.table) {

    throw new Error(
      "Tabela não encontrada."
    );

  }


  return data.table;

}


/* =========================================================
   DETECTA COLUNAS AUTOMATICAMENTE
   ========================================================= */

function findColumns(table) {

  const cols =
    table.cols || [];


  const headers =
    cols.map(
      (column,index) =>
        String(
          column.label ||
          column.id ||
          `Coluna ${index + 1}`
        ).trim()
    );


  console.log(
    "Cabeçalhos encontrados:",
    headers
  );


  /*
     Candidatos para NOME
  */

  const nameCandidates = [

    "nome",

    "nomes",

    "tecnico",

    "tecnicos",

    "tecnico nome",

    "colaborador",

    "colaborador nome",

    "funcionario",

    "funcionarios",

    "profissional",

    "pessoa",

    "responsavel",

    "responsável",

    "usuario",

    "usuário",

    "apelido"

  ];


  /*
     Candidatos para PONTUAÇÃO
  */

  const scoreCandidates = [

    "pontuacao final",

    "pontuacao",

    "pontuacao total",

    "pontos",

    "pontos finais",

    "score",

    "scores",

    "total",

    "resultado",

    "nota",

    "ranking",

    "performance"

  ];


  let nameIndex = -1;

  let scoreIndex = -1;


  /*
     Busca exata.
  */

  for (
    let i = 0;
    i < headers.length;
    i++
  ) {

    const normalized =
      normalizeText(
        headers[i]
      );


    if (
      nameIndex === -1 &&
      nameCandidates.includes(
        normalized
      )
    ) {

      nameIndex = i;

    }


    if (
      scoreIndex === -1 &&
      scoreCandidates.includes(
        normalized
      )
    ) {

      scoreIndex = i;

    }

  }


  /*
     Busca parcial.
  */

  if (nameIndex === -1) {

    nameIndex =
      headers.findIndex(
        header =>
          normalizeText(header)
            .includes("nome")
      );

  }


  if (scoreIndex === -1) {

    scoreIndex =
      headers.findIndex(
        header => {

          const h =
            normalizeText(header);

          return (
            h.includes("pontu") ||
            h.includes("ponto") ||
            h.includes("score") ||
            h.includes("nota")
          );

        }
      );

  }


  /*
     Se ainda não encontrou o nome,
     assumimos primeira coluna.
  */

  if (
    nameIndex === -1 &&
    headers.length > 0
  ) {

    nameIndex = 0;

  }


  /*
     Se ainda não encontrou pontuação,
     procura a primeira coluna que
     contenha números nos dados.
  */

  if (
    scoreIndex === -1
  ) {

    const rows =
      table.rows || [];


    for (
      let columnIndex = 0;
      columnIndex < headers.length;
      columnIndex++
    ) {

      let numericCount = 0;


      rows.forEach(row => {

        const cell =
          row.c?.[columnIndex];


        if (!cell) {
          return;
        }


        const value =
          cell.v ??
          cell.f;


        if (
          value !== null &&
          value !== undefined &&
          value !== "" &&
          !isNaN(
            parseScore(value)
          )
        ) {

          numericCount++;

        }

      });


      if (
        numericCount >=
        Math.max(
          1,
          Math.floor(
            rows.length * 0.5
          )
        )
      ) {

        scoreIndex =
          columnIndex;

        break;

      }

    }

  }


  /*
     Último fallback:

     segunda coluna.
  */

  if (
    scoreIndex === -1 &&
    headers.length > 1
  ) {

    scoreIndex = 1;

  }


  return {
    headers,
    nameIndex,
    scoreIndex
  };

}


/* =========================================================
   TRANSFORMA DADOS
   ========================================================= */

function parseSheet(table) {

  const {
    headers,
    nameIndex,
    scoreIndex
  } =
    findColumns(table);


  console.log(
    "Coluna nome:",
    nameIndex,
    headers[nameIndex]
  );


  console.log(
    "Coluna pontuação:",
    scoreIndex,
    headers[scoreIndex]
  );


  /*
     Se não houver duas colunas,
     mostra diagnóstico.
  */

  if (
    nameIndex === -1 ||
    scoreIndex === -1
  ) {

    throw new Error(
      "Não foi possível identificar as colunas."
    );

  }


  const rows =
    table.rows || [];


  const people = [];


  rows.forEach(row => {

    const cells =
      row.c || [];


    const nameCell =
      cells[nameIndex];


    const scoreCell =
      cells[scoreIndex];


    const name =
      nameCell?.v ??
      nameCell?.f ??
      "";


    const score =
      scoreCell?.v ??
      scoreCell?.f ??
      "";


    const cleanName =
      String(name).trim();


    if (!cleanName) {
      return;
    }


    /*
       Ignora possíveis cabeçalhos
       dentro dos dados.
    */

    const normalizedName =
      normalizeText(cleanName);


    if (
      normalizedName === "nome" ||
      normalizedName === "tecnico" ||
      normalizedName === "colaborador" ||
      normalizedName === "funcionario"
    ) {

      return;

    }


    const numericScore =
      parseScore(score);


    /*
       Se a pontuação não é numérica,
       ignora a linha.
    */

    if (
      score !== "" &&
      isNaN(
        parseScore(score)
      )
    ) {

      return;

    }


    people.push({
      name: cleanName,
      score: numericScore
    });

  });


  people.sort(
    (a,b) =>
      b.score - a.score
  );


  return {
    people,
    headers,
    nameColumn:
      headers[nameIndex] ||
      `Coluna ${nameIndex + 1}`,
    scoreColumn:
      headers[scoreIndex] ||
      `Coluna ${scoreIndex + 1}`
  };

}


/* =========================================================
   PODIUM
   ========================================================= */

function renderPodium(
  key,
  people
) {

  const podium =
    document.getElementById(
      `podium-${key}`
    );


  const positions = [

    {
      className: "second",
      medal: "🥈",
      index: 1
    },

    {
      className: "first",
      medal: "🥇",
      index: 0
    },

    {
      className: "third",
      medal: "🥉",
      index: 2
    }

  ];


  podium.innerHTML =
    positions.map(
      position => {

        const person =
          people[position.index];


        if (!person) {

          return `

            <div
              class="podium-item ${position.className}"
            >

              <div class="medal">
                ${position.medal}
              </div>

              <div class="podium-card">

                <div class="person-name empty-name">
                  —
                </div>

                <div class="person-score">
                  —
                </div>

              </div>

            </div>

          `;

        }


        return `

          <div
            class="podium-item ${position.className}"
          >

            <div class="medal">
              ${position.medal}
            </div>

            <div class="podium-card">

              <div class="person-name">
                ${escapeHTML(person.name)}
              </div>

              <div class="person-score">
                ${formatScore(person.score)}
              </div>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =========================================================
   RANKING
   ========================================================= */

function renderRanking(
  key,
  people
) {

  const ranking =
    document.getElementById(
      `ranking-${key}`
    );


  if (!people.length) {

    ranking.innerHTML = `

      <div class="empty-message">

        Nenhuma pontuação encontrada.

      </div>

    `;

    return;

  }


  const maxScore =
    Math.max(
      ...people.map(
        p => p.score
      ),
      1
    );


  ranking.innerHTML = `

    <div class="ranking-title">

      <span>
        CLASSIFICAÇÃO
      </span>

      <span>
        PONTUAÇÃO
      </span>

    </div>


    <div class="ranking-list">

      ${
        people
          .slice(0,10)
          .map(
            (person,index) => {

              const width =
                Math.max(
                  3,
                  (
                    person.score /
                    maxScore
                  ) * 100
                );


              return `

                <div class="ranking-row">

                  <div class="ranking-position">
                    #${index + 1}
                  </div>


                  <div>

                    <div class="ranking-person-name">
                      ${escapeHTML(person.name)}
                    </div>

                    <div class="bar-container">

                      <div
                        class="bar"
                        style="width:${width}%"
                      ></div>

                    </div>

                  </div>


                  <div class="ranking-score">
                    ${formatScore(person.score)}
                  </div>

                </div>

              `;

            }
          )
          .join("")
      }

    </div>

  `;

}


/* =========================================================
   CONEXÃO
   ========================================================= */

function updateConnection(
  key,
  name,
  type,
  message
) {

  let element =
    document.getElementById(
      `connection-${key}`
    );


  if (!element) {

    element =
      document.createElement(
        "div"
      );

    element.id =
      `connection-${key}`;


    document.getElementById(
      "connectionList"
    ).appendChild(
      element
    );

  }


  element.className =
    `connection ${type}`;


  element.innerHTML = `

    <strong>
      ${escapeHTML(name)}
    </strong>

    ${escapeHTML(message)}

  `;

}


/* =========================================================
   DEPARTAMENTO
   ========================================================= */

async function loadDepartment(
  department
) {

  const status =
    document.getElementById(
      `status-${department.key}`
    );


  const diagnostic =
    document.getElementById(
      `diagnostic-${department.key}`
    );


  status.className =
    "status loading";


  status.textContent =
    "⏳ Consultando Google Sheets...";


  diagnostic.classList.remove(
    "visible"
  );


  updateConnection(
    department.key,
    department.name,
    "loading",
    "Conectando..."
  );


  try {

    const table =
      await loadSheet(
        department.sheet
      );


    const parsed =
      parseSheet(table);


    const people =
      parsed.people;


    /*
       Quantidade
    */

    document.getElementById(
      `count-${department.key}`
    ).textContent =
      `${people.length} ${
        people.length === 1
          ? "pessoa"
          : "pessoas"
      }`;


    /*
       Ranking
    */

    renderPodium(
      department.key,
      people
    );


    renderRanking(
      department.key,
      people
    );


    /*
       Status
    */

    status.className =
      "status success";


    status.innerHTML =
      `🟢 Conectado · ${people.length} registros encontrados`;


    /*
       Diagnóstico das colunas
    */

    diagnostic.classList.add(
      "visible"
    );


    diagnostic.innerHTML =
      `
        Coluna identificada para nome:
        <strong>${escapeHTML(parsed.nameColumn)}</strong>
        <br>
        Coluna identificada para pontuação:
        <strong>${escapeHTML(parsed.scoreColumn)}</strong>
      `;


    updateConnection(
      department.key,
      department.name,
      "ok",
      `${people.length} registros · ${parsed.nameColumn} / ${parsed.scoreColumn}`
    );


    return true;

  }

  catch(error) {

    console.error(
      department.sheet,
      error
    );


    status.className =
      "status error";


    status.innerHTML =
      `🔴 ${escapeHTML(error.message)}`;


    diagnostic.classList.add(
      "visible"
    );


    diagnostic.innerHTML =
      `
        O sistema não conseguiu identificar
        corretamente os dados desta aba.
        <br><br>
        Abra o console do navegador
        (F12 → Console) para visualizar
        os cabeçalhos recebidos do Google Sheets.
      `;


    updateConnection(
      department.key,
      department.name,
      "error",
      error.message
    );


    return false;

  }

}


/* =========================================================
   CARREGAMENTO GERAL
   ========================================================= */

async function loadAll() {

  if (loading) {
    return;
  }


  loading = true;


  const button =
    document.getElementById(
      "refreshButton"
    );


  button.disabled = true;


  button.textContent =
    "↻ ATUALIZANDO...";


  document.getElementById(
    "connectionList"
  ).innerHTML = "";


  const results =
    await Promise.all(
      DEPARTMENTS.map(
        department =>
          loadDepartment(
            department
          )
      )
    );


  const successful =
    results.filter(Boolean).length;


  const now =
    new Date();


  const formattedDate =
    now.toLocaleString(
      "pt-BR"
    );


  document.getElementById(
    "lastUpdate"
  ).textContent =
    `Última atualização: ${formattedDate}`;


  if (
    successful ===
    DEPARTMENTS.length
  ) {

    document.getElementById(
      "lastUpdate"
    ).textContent +=
      " · 🟢 Todas as abas conectadas";

  }

  else if (
    successful > 0
  ) {

    document.getElementById(
      "lastUpdate"
    ).textContent +=
      ` · 🟡 ${successful}/${DEPARTMENTS.length} abas conectadas`;

  }

  else {

    document.getElementById(
      "lastUpdate"
    ).textContent +=
      " · 🔴 Nenhuma aba conectada";

  }


  button.disabled = false;

  button.textContent =
    "↻ ATUALIZAR";


  loading = false;

}


/* =========================================================
   START
   ========================================================= */

initializeDashboard();

loadAll();


/*
   Atualização automática.
*/

setInterval(
  loadAll,
  REFRESH_INTERVAL
);

</script>
