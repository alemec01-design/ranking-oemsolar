<script>

/* =========================================================
   LEITURA ROBUSTA DA PONTUAÇÃO
   ========================================================= */

function parseScore(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return 0;
  }

  /*
     Se o Google já entregou como número,
     usamos diretamente.
  */

  if (typeof value === "number") {

    return Number.isFinite(value)
      ? value
      : 0;

  }


  let text =
    String(value)
      .trim();


  if (!text) {
    return 0;
  }


  /*
     Remove espaços.
  */

  text =
    text.replace(/\s/g, "");


  /*
     Remove textos comuns.
     
     Exemplos:
     "150 pontos"
     "150 pts"
     "150pt"
     "150%"
  */

  text =
    text
      .replace(/pontos?/gi, "")
      .replace(/pts?/gi, "")
      .replace(/%/g, "");


  /*
     Caso brasileiro:

     1.250,50
     -> 1250.50
  */

  if (
    text.includes(".") &&
    text.includes(",")
  ) {

    if (
      text.lastIndexOf(",") >
      text.lastIndexOf(".")
    ) {

      text =
        text
          .replace(/\./g, "")
          .replace(",", ".");

    }

    else {

      text =
        text.replace(/,/g, "");

    }

  }

  /*
     Caso:

     1250,50
  */

  else if (
    text.includes(",")
  ) {

    /*
       Se houver somente uma vírgula,
       tratamos como decimal.
    */

    text =
      text.replace(",", ".");

  }

  /*
     Caso:

     1.250

     Aqui existe uma ambiguidade:

     1.250 pode significar 1250
     ou 1,25.

     Como estamos tratando pontuação,
     assumimos milhar quando houver
     exatamente 3 números após o ponto.
  */

  else if (
    text.includes(".")
  ) {

    const parts =
      text.split(".");


    if (
      parts.length === 2 &&
      parts[1].length === 3
    ) {

      text =
        parts[0] +
        parts[1];

    }

  }


  /*
     Mantém apenas números,
     ponto decimal e sinal.
  */

  text =
    text.replace(
      /[^0-9.-]/g,
      ""
    );


  const number =
    Number(text);


  if (
    Number.isFinite(number)
  ) {

    return number;

  }


  return 0;

}


/* =========================================================
   NORMALIZAÇÃO
   ========================================================= */

function normalizeText(value) {

  return String(value ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim()
    .toLowerCase();

}


/* =========================================================
   DETECÇÃO DAS COLUNAS
   ========================================================= */

function findColumns(table) {

  const cols =
    table.cols || [];


  const headers =
    cols.map(
      (column, index) => {

        return String(
          column.label ||
          column.id ||
          `Coluna ${index + 1}`
        ).trim();

      }
    );


  console.log(
    "===================================="
  );

  console.log(
    "COLUNAS RECEBIDAS:",
    headers
  );


  /*
     Possíveis nomes para pessoa.
  */

  const nameKeywords = [

    "nome",
    "nomes",
    "tecnico",
    "tecnicos",
    "colaborador",
    "colaboradores",
    "funcionario",
    "funcionarios",
    "responsavel",
    "responsáveis",
    "profissional",
    "pessoa",
    "usuario",
    "usuario",
    "matricula"

  ];


  /*
     Possíveis nomes para pontuação.

     Incluímos palavras parciais porque
     sua planilha pode ter algo como:

     Pontuação Final Atual
     Pontuação Geral
     Pontuação Equipe
     Score Final
     Pontos Totais
     etc.
  */

  const scoreKeywords = [

    "pontuacao",
    "pontuação",
    "ponto",
    "pontos",
    "score",
    "nota",
    "performance",
    "desempenho",
    "resultado",
    "total",
    "final"

  ];


  let nameIndex = -1;

  let scoreIndex = -1;


  /*
     Primeiro tenta identificar pelo nome
     completo do cabeçalho.
  */

  headers.forEach(
    (header, index) => {

      const normalized =
        normalizeText(header);


      /*
         Nome
      */

      if (
        nameIndex === -1 &&
        nameKeywords.some(
          keyword =>
            normalized ===
            normalizeText(keyword)
        )
      ) {

        nameIndex = index;

      }


      /*
         Pontuação
      */

      if (
        scoreIndex === -1 &&
        (
          normalized.includes("pontu") ||
          normalized.includes("score") ||
          normalized.includes("ponto") ||
          normalized.includes("performance") ||
          normalized.includes("desempenho")
        )
      ) {

        scoreIndex = index;

      }

    }
  );


  /*
     Se não encontrou nome,
     primeira coluna.
  */

  if (
    nameIndex === -1 &&
    headers.length > 0
  ) {

    nameIndex = 0;

  }


  /*
     Se não encontrou pontuação,
     vamos analisar o conteúdo de cada
     coluna.
  */

  if (
    scoreIndex === -1
  ) {

    const rows =
      table.rows || [];


    let bestColumn = -1;

    let bestNumericCount = 0;


    for (
      let columnIndex = 0;
      columnIndex < headers.length;
      columnIndex++
    ) {

      /*
         Nunca usamos a coluna do nome
         como coluna de pontuação.
      */

      if (
        columnIndex === nameIndex
      ) {

        continue;

      }


      let numericCount = 0;


      rows.forEach(
        row => {

          const cell =
            row.c?.[columnIndex];


          if (!cell) {
            return;
          }


          const rawValue =
            cell.v ??
            cell.f;


          if (
            rawValue === null ||
            rawValue === undefined ||
            rawValue === ""
          ) {

            return;

          }


          const parsed =
            parseScore(rawValue);


          /*
             Considera válido inclusive
             quando o valor é 0.
          */

          if (
            !isNaN(parsed) &&
            String(rawValue)
              .trim() !== ""
          ) {

            numericCount++;

          }

        }
      );


      console.log(
        "Coluna",
        columnIndex,
        headers[columnIndex],
        "→",
        numericCount,
        "valores numéricos"
      );


      if (
        numericCount >
        bestNumericCount
      ) {

        bestNumericCount =
          numericCount;

        bestColumn =
          columnIndex;

      }

    }


    if (
      bestColumn !== -1
    ) {

      scoreIndex =
        bestColumn;

    }

  }


  /*
     Último fallback:
     segunda coluna.
  */

  if (
    scoreIndex === -1 &&
    headers.length > 1
  ) {

    scoreIndex = 1;

  }


  console.log(
    "COLUNA NOME:",
    nameIndex,
    headers[nameIndex]
  );


  console.log(
    "COLUNA PONTUAÇÃO:",
    scoreIndex,
    headers[scoreIndex]
  );


  console.log(
    "===================================="
  );


  return {

    headers,

    nameIndex,

    scoreIndex

  };

}


/* =========================================================
   CONVERTE A PLANILHA EM RANKING
   ========================================================= */

function parseSheet(table) {

  const columns =
    findColumns(table);


  const {
    headers,
    nameIndex,
    scoreIndex
  } =
    columns;


  if (
    nameIndex === -1 ||
    scoreIndex === -1
  ) {

    throw new Error(
      "Não foi possível identificar as colunas."
    );

  }


  const rows =
    table.rows || [];


  const people = [];


  rows.forEach(
    (row, rowIndex) => {

      const cells =
        row.c || [];


      const nameCell =
        cells[nameIndex];


      const scoreCell =
        cells[scoreIndex];


      if (!nameCell) {
        return;
      }


      const rawName =
        nameCell.v ??
        nameCell.f ??
        "";


      const rawScore =
        scoreCell?.v ??
        scoreCell?.f ??
        "";


      const name =
        String(rawName).trim();


      if (!name) {
        return;
      }


      /*
         Não adiciona linha que seja
         o próprio cabeçalho.
      */

      const normalizedName =
        normalizeText(name);


      if (
        normalizedName === "nome" ||
        normalizedName === "tecnico" ||
        normalizedName === "colaborador"
      ) {

        return;

      }


      const score =
        parseScore(rawScore);


      console.log(
        "LINHA",
        rowIndex + 1,
        "→",
        name,
        "→",
        rawScore,
        "→",
        score
      );


      people.push({

        name,

        score

      });

    }
  );


  /*
     Ordenação decrescente.
  */

  people.sort(
    (a,b) =>
      b.score - a.score
  );


  return {

    people,

    nameColumn:
      headers[nameIndex],

    scoreColumn:
      headers[scoreIndex]

  };

}

</script>
